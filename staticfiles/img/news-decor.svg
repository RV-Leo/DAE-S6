<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-hidden="true">
  <defs>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#newsGrad)" stroke-width="3" stroke-dasharray="10,5">
    <animate attributeName="stroke-dashoffset" from="0" to="30" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M60 100 L90 130 L140 70" fill="none" stroke="#3498db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" fill="freeze" begin="0.5s"/>
  </path>
  <circle cx="70" cy="90" r="12" fill="#3498db" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.5s"/>
  </circle>
  <rect x="85" y="80" width="30" height="6" rx="3" fill="#3498db" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.7s"/>
  </rect>
  <rect x="85" y="92" width="20" height="4" rx="2" fill="#2c3e50" opacity="0.5">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.9s"/>
  </rect>
  <rect x="85" y="102" width="25" height="4" rx="2" fill="#2c3e50" opacity="0.5">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.1s"/>
  </rect>
</svg>