<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movies{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-slate-950 text-slate-100">
    <nav class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="{% url 'movies:movie_list' %}" class="font-bold tracking-tight text-amber-400">🎬 Movies</a>
            <a href="{% url 'admin:index' %}" class="text-sm text-slate-400 hover:text-white">Admin</a>
        </div>
    </nav>
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
